org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP registers generated sources via kotlin.sourceSets; built-in Kotlin (AGP 9)
# rejects that by default. Opt out so Room/KSP codegen keeps working.
android.disallowKotlinSourceSets=false
# Debug APKs: keep stored entries contiguous instead of zero-padding them
# to aligned slots (turns a 29 MB padded file into its real ~5 MB payload).
android.experimental.sparsePackaging=false
